[project]
name = "stackweaver-ansible-runner"
version = "0.1.0"
requires-python = ">=3.12"
description = "Python dependencies for the Stackweaver Ansible runner image"

dependencies = [
    # The collections bundled with the ansible package are the ones every job loads: the image
    # installs no collection of its own, so their versions are whatever this ansible release
    # ships, and the version locked in uv.lock is the one lever for the image's collection set.
    # Floor at 14.2 because it bundles azure.azcollection 3.20.0, which adds the AZURE_TENANT_ID
    # fallback + caller subscription_id merge for workload identity
    # (ansible-collections/azure#2274). NO upper cap, so Renovate tracks the latest ansible.
    "ansible>=14.2",
    "ansible-lint>=25.0",
    "jmespath>=1.0",
    "netaddr>=1.0",
]

[dependency-groups]
aws = [
    "boto3>=1.35",
    "botocore>=1.35",
]

azure = [
    "azure-identity>=1.19",
    "azure-mgmt-resource>=25.0",
    "azure-mgmt-compute>=37.0",
    "azure-mgmt-network>=30.0",
    "azure-mgmt-subscription>=3.0",
    "azure-cli-core>=2.84",
]

gcp = [
    "google-auth>=2.30",
]

vmware = [
    "pyvmomi>=9.0",
]

# Convenience group: install everything (default for official image)
all = [
    { include-group = "aws" },
    { include-group = "azure" },
    { include-group = "gcp" },
    { include-group = "vmware" },
]

[tool.uv]
# Lock only for the platforms targeted by the Docker image
environments = [
    "sys_platform == 'linux' and python_version >= '3.12'",
]
# Some Azure SDK packages the collection needs ship only as pre-releases; allow them when necessary
prerelease = "allow"
