---
collections:
  - name: amazon.aws
    version: ">=9.0.0"
  - name: azure.azcollection
    # >=3.17.0 required: that release added native OIDC / workload-identity federation to the
    # azure_rm inventory plugin (oidc_token_file_path / AZURE_FEDERATED_TOKEN_FILE), which replaced
    # the hand-rolled oidc-ansible-inventory wrapper (now archived). Do not lower this pin.
    version: ">=3.17.0"
  - name: google.cloud
    version: ">=1.4.0"
  - name: community.vmware
    version: ">=5.0.0"
  - name: community.general
    version: ">=10.0.0"
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.netcommon
    version: ">=7.0.0"
